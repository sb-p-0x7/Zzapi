<text x="744" y="624" class="label">Cutter</text>
<text x="744" y="646" class="small">cut pizza</text>
<rect x="420" y="695" width="210" height="60" class="box"/>
<text x="434" y="719" class="label">PackagingMachine</text>
<text x="434" y="741" class="small">RawDough -&gt; BoxedPizza</text>
<rect x="785" y="695" width="185" height="60" class="box"/>
