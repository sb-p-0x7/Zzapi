<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#536170"/>
    </marker>
    <style>
      .title { font: 700 24px Arial, sans-serif; fill: #18212b; }
      .label { font: 700 15px Arial, sans-serif; fill: #18212b; }
      .small { font: 13px Arial, sans-serif; fill: #2f3b48; }
      .tiny { font: 12px Arial, sans-serif; fill: #44515f; }
      .box { fill: #f8fbff; stroke: #8da2b8; stroke-width: 1.4; rx: 10; }
      .model { fill: #eef8f1; stroke: #71a87f; }
      .ui { fill: #fff7e8; stroke: #d09a43; }
      .boundary { fill: #f3f0ff; stroke: #8f7fd1; }
      .control { fill: #eef6ff; stroke: #6c9eca; }
      .abstract { fill: #f7f9fc; stroke: #657789; }
      .edge { stroke: #536170; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .inherit { stroke: #536170; stroke-width: 1.5; fill: none; marker-end: url(#arrow); stroke-dasharray: 0; }
      .dash { stroke-dasharray: 5 5; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="32" y="38" class="title">4. Runtime Frame Flow</text>
  
<rect x="55" y="150" width="170" height="80" class="box"/>
<text x="69" y="174" class="label">main.cpp</text>
<text x="69" y="196" class="small">calls App::Update</text>
<rect x="285" y="145" width="190" height="90" class="box"/>
<text x="299" y="169" class="label">App</text>
<text x="299" y="191" class="small">frame coordinator</text>
<rect x="540" y="90" width="210" height="90" class="box model"/>
<text x="554" y="114" class="label">Factory</text>
<text x="554" y="136" class="small">snapshot()</text>
<rect x="540" y="260" width="210" height="90" class="box ui"/>
<text x="554" y="284" class="label">DashboardView</text>
<text x="554" y="306" class="small">Render(snap, cmd)</text>
<rect x="820" y="260" width="210" height="90" class="box boundary"/>
<text x="834" y="284" class="label">FactoryCmd</text>
<text x="834" y="306" class="small">one-frame flags</text>
<rect x="820" y="430" width="210" height="90" class="box control"/>
<text x="834" y="454" class="label">FactoryController</text>
<text x="834" y="476" class="small">applyCmd()</text>
<text x="834" y="494" class="small">advance(dt)</text>
<rect x="1080" y="430" width="150" height="90" class="box model"/>
<text x="1094" y="454" class="label">Factory</text>
<text x="1094" y="476" class="small">step()</text>

<path d="M225,190 L285,190" class="edge"/>
<text x="261" y="184" class="tiny">Update()</text>
<path d="M475,170 L540,135" class="edge"/>
<text x="513.5" y="146.5" class="tiny">snapshot()</text>
<path d="M645,180 L645,260" class="edge"/>
<text x="651" y="214" class="tiny">FactorySnap</text>
<path d="M750,305 L820,305" class="edge"/>
<text x="791" y="299" class="tiny">set flags</text>
<path d="M925,350 L925,430" class="edge"/>
<text x="931" y="384" class="tiny">cmd</text>
<path d="M1030,475 L1080,475" class="edge"/>
<text x="1061" y="469" class="tiny">step zero or more</text>
<path d="M820,475 L645,475 L645,180" class="edge"/>
<text x="651" y="469" class="tiny">calls API</text>

</svg>
